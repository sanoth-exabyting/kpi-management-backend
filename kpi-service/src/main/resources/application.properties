spring.application.name=kpi-service
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8082}

# Primary Database Configuration
spring.datasource.primary.jdbc-url=${DATABASE_URL}
spring.datasource.primary.username=${DATABASE_USERNAME}
spring.datasource.primary.password=${DATABASE_PASSWORD}
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# Secondary Database Configuration
spring.datasource.secondary.jdbc-url=${SECONDARY_DATABASE_URL}
spring.datasource.secondary.username=${SECONDARY_DATABASE_USERNAME}
spring.datasource.secondary.password=${SECONDARY_DATABASE_PASSWORD}
spring.datasource.secondary.driver-class-name=org.postgresql.Driver

# Flyway Configuration (Only for Primary DB)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-description=Initial baseline
spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${DATABASE_USERNAME}
spring.flyway.password=${DATABASE_PASSWORD}

# Flyway validation for development environment
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

# JPA/Hibernate Configuration (Development settings)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Disable Hibernate DDL
spring.jpa.hibernate.ddl-auto=none

# JPA Auditing
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# SMTP configurations
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.from_mail=${FROM_MAIL}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Application Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000,http://localhost:5000}
